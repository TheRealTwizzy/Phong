name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Before `npm ci`: it needs no dependencies and costs milliseconds, so it
      # fails before anything is installed. A file named scripts/e2e-<name>.mjs
      # that is missing from e2e-run.mjs's SUITES is not a skipped test, it is
      # a test nobody knows is not running — it reads as coverage in review and
      # never executes. Nothing else can notice: `npm test` does not touch
      # these files, tsc does not read them, and the runner cannot report a
      # suite it was never told about.
      - name: Every browser suite is registered
        run: npm run lint:suites

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      # Coverage rather than a bare `npm test`: same suites, plus the floors on
      # the shared pure logic. There is no global threshold — src/components is
      # Playwright's job (see the `e2e` job below), and a global number would
      # either fail on that or be set low enough to measure nothing. The floors
      # and the reasoning live in vite.config.ts.
      - name: Test + coverage floors
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # The browser suites drive a real Chromium against a real server, so they
  # cost minutes where `verify` costs seconds. Kept as its own job: it runs
  # alongside `verify` rather than in front of it, and a red one names the
  # broken flow instead of a broken build.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keyed on the lockfile, so a playwright-core bump fetches the matching
      # browser instead of running against a stale one.
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      # The suites run against `node dist/server.cjs` — the production entry,
      # not the dev server — so a build is a precondition, not a side errand.
      - name: Build
        run: npm run build

      - name: Browser E2E
        run: npm run test:e2e
