services:
  - type: web
    name: phong
    runtime: node
    plan: starter # persistent disks require a paid instance
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Render reads NODE_VERSION or .node-version — NOT .nvmrc, which is what
      # this repo has — and package.json's `engines: ">=22"` permits Node 24.
      # So without this the runtime was whatever Render defaulted to that
      # month, against a server that uses `node:sqlite`.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      # Backups. Render gives a service ONE disk and the starter plan cannot
      # attach a second, so unlike the Docker deployments there is nowhere on
      # this host for a snapshot to live that would survive losing the disk:
      # **on Render the bucket IS the backup**, and BACKUP_DIR below is only a
      # staging area for the file on its way out. Hence keep 2 rather than 14 —
      # /tmp is ephemeral and shares the instance's own storage.
      - key: BACKUP_ENABLED
        value: "1"
      - key: BACKUP_DIR
        value: /tmp/backups
      - key: BACKUP_KEEP
        value: "2"
      # Offsite. Set these in the dashboard, not here — `sync: false` means
      # Render prompts for a value and never stores one in the repo. With the
      # endpoint empty the scheduler still takes local snapshots, which on this
      # plan means it is writing to ephemeral storage and protecting nothing.
      # Use a PutObject-only credential.
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
    disk:
      name: phong-data
      mountPath: /data
      sizeGB: 1
