# Phong on a single VPS/KVM:
#   app    - the game server (client + WebSocket relay + API) on the internal network
#   caddy  - TLS termination + reverse proxy with automatic Let's Encrypt certs
#   coturn - OPTIONAL TURN relay for P2P matches behind strict NATs
#            (enable with: docker compose --profile turn up -d)
#
# Configure via .env next to this file (see deploy/.env.example).

services:
  phong:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: 3000
      TURN_URL: ${TURN_URL:-}
      TURN_STATIC_SECRET: ${TURN_STATIC_SECRET:-}
      # Backups. Off unless BACKUP_ENABLED is set, so an operator pasting keys
      # in to test them does not also start a schedule. See deploy/.env.example.
      BACKUP_ENABLED: ${BACKUP_ENABLED:-}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-}
      # Offsite. Empty endpoint = local snapshots only, which is half a backup:
      # losing the host is the likeliest thing you are recovering from.
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_SESSION_TOKEN: ${BACKUP_S3_SESSION_TOKEN:-}
      BACKUP_S3_VIRTUAL_HOST: ${BACKUP_S3_VIRTUAL_HOST:-}
      BACKUP_S3_SSE: ${BACKUP_S3_SSE:-}
      BACKUP_S3_UNSIGNED_PAYLOAD: ${BACKUP_S3_UNSIGNED_PAYLOAD:-}
      BACKUP_S3_ALLOW_INSECURE: ${BACKUP_S3_ALLOW_INSECURE:-}
    volumes:
      - phong-data:/data
      # Backups go on their own volume, never on the one they protect — that
      # is the whole point of the guard in scripts/backup.mjs, and without
      # this mount the backup command in DEPLOYMENT.md cannot run at all.
      # A named volume rather than a bind mount so the runbook works with no
      # host-side setup: Docker seeds it from the image, where the Dockerfile
      # has already made it writable by the unprivileged user. To put backups
      # on a host path instead, swap this for `- ./backups:/backups` and
      # `mkdir -p backups && chown 1000:1000 backups` first — a bind mount
      # takes the host directory's ownership, and Docker creates a missing one
      # as root.
      #
      # The in-process scheduler writes here too (BACKUP_ENABLED=1), so this
      # mount is what stops it landing on the same filesystem as /data — which
      # the boot log warns about, because a volume loss would take both.
      - phong-backups:/backups
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PHONG_DOMAIN: ${PHONG_DOMAIN:-phong.too-many-coins.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - phong

  coturn:
    image: coturn/coturn:4-alpine
    profiles: ["turn"]
    restart: unless-stopped
    # TURN needs its real ports exposed directly; host networking keeps the
    # relay port range simple.
    network_mode: host
    command: >
      --listening-port=3478
      --realm=${PHONG_DOMAIN:-phong.too-many-coins.com}
      --use-auth-secret
      --static-auth-secret=${TURN_STATIC_SECRET}
      --min-port=49160
      --max-port=49200
      --no-cli
      --no-tls
      --no-dtls
      --fingerprint

volumes:
  phong-data:
  phong-backups:
  caddy-data:
  caddy-config:
