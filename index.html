<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Pinch zoom stays enabled: locking it (maximum-scale/user-scalable)
         strands players whose browser zoom or text size isn't 100%, and iOS
         ignores the lock anyway. The canvas itself opts out via touch-none. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Split-Screen Half Pong</title>
    <meta name="description" content="A blind half-court Pong game for Android & iOS where the net is at the top of your screen." />
    <meta property="og:title" content="Split-Screen Half Pong" />
    <meta property="og:description" content="A blind half-court Pong game for Android & iOS where the net is at the top of your screen." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
