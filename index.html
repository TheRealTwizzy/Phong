<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The game presents at exactly device size, always. maximum-scale=1 is
         what stops iOS Safari's auto-zoom when a sub-16px input is focused —
         the page used to stay zoomed after typing a room code, so the match
         started cropped. iOS still allows a deliberate pinch despite the cap
         (it ignores it for user gestures since iOS 10); Android honors the
         lock, which is the fixed presentation a court game wants, and its
         "force enable zoom" accessibility setting still overrides it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Phong</title>
    <meta name="description" content="A blind half-court Pong for two phones. You only see your own half — the top of your screen is the net." />
    <!-- The LINK is how this game spreads: an invitation is tapped out of a
         chat app, and the card that app renders is the first thing a stranger
         sees. It named a different product ("Split-Screen Half Pong") and
         carried no image while declaring `summary_large_image`, so the card
         was blank under the wrong name. og:image is an absolute URL because
         relative ones are not resolved by most crawlers. -->
    <meta property="og:title" content="Phong" />
    <meta property="og:description" content="A blind half-court Pong for two phones. You only see your own half — the top of your screen is the net." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://phong.too-many-coins.com/" />
    <meta property="og:image" content="https://phong.too-many-coins.com/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Phong" />
    <meta name="twitter:description" content="A blind half-court Pong for two phones. You only see your own half — the top of your screen is the net." />
    <meta name="twitter:image" content="https://phong.too-many-coins.com/og.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
