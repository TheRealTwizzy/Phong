<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The game presents at exactly device size, always. maximum-scale=1 is
         what stops iOS Safari's auto-zoom when a sub-16px input is focused —
         the page used to stay zoomed after typing a room code, so the match
         started cropped. iOS still allows a deliberate pinch despite the cap
         (it ignores it for user gestures since iOS 10); Android honors the
         lock, which is the fixed presentation a court game wants, and its
         "force enable zoom" accessibility setting still overrides it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Split-Screen Half Pong</title>
    <meta name="description" content="A blind half-court Pong game for Android & iOS where the net is at the top of your screen." />
    <meta property="og:title" content="Split-Screen Half Pong" />
    <meta property="og:description" content="A blind half-court Pong game for Android & iOS where the net is at the top of your screen." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
